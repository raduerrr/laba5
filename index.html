<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР5</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="calculator.js"></script>
</head>
<body>
    <main class="container">
        <h1>Калькулятор стоимости заказа</h1>
        <form id="order-form">
            <div class="form-group">
                <label for="product">Выберите товар:</label>
                <select id="product" name="product">
                    <option value="1200">Игровая мышь — 1 200 руб.</option>
                    <option value="4500">Механическая клавиатура — 4 500 руб.</option>
                    <option value="8900">Беспроводная гарнитура — 8 900 руб.</option>
                    <option value="24000">Монитор 144 Гц — 24 000 руб.</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Количество товара:</label>
                <input type="text" id="quantity" name="quantity" placeholder="Например: 2">
            </div>

            <button type="button" id="calculate-btn">Рассчитать стоимость</button>
        </form>

        <div id="result" class="result" aria-live="polite"></div>
    </main>
</body>
</html>
